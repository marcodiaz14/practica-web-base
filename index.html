<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Práctica web — Informática III</title>
  </head>
  <body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

    <header class="text-center py-6">
      <h1 class="text-2xl font-bold">Catarsis</h1>
      <p class="text-gray-600 text-sm mt-1">Los mejores servicios en catarsis</p>
    </header>

    <main class="max-w-6xl mx-auto p-6 w-full grow">
      <div id="filtros" class="flex flex-wrap gap-2 mb-6 justify-center">
        <button data-categoria="Todos" class="btn-filtro bg-blue-600 text-white px-4 py-2 rounded font-bold transition">
          Todos
        </button>
        <button data-categoria="servicio" class="btn-filtro bg-white text-gray-800 border px-4 py-2 rounded font-bold hover:bg-gray-100 transition">
          Servicios
        </button>
        <button data-categoria="producto" class="btn-filtro bg-white text-gray-800 border px-4 py-2 rounded font-bold hover:bg-gray-100 transition">
          Productos
        </button>
        <button data-categoria="cursos" class="btn-filtro bg-white text-gray-800 border px-4 py-2 rounded font-bold hover:bg-gray-100 transition">
          Cursos
        </button>
      </div>

      <!-- Catálogo de productos/servicios -->
      <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-8">
        <!-- Tarjetas dinámicas -->
      </div>

      <!-- NUEVA SECCIÓN: Pedidos registrados -->
      <section class="my-8 p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4 text-center">Pedidos registrados</h2>
        <div id="pedidos-registrados" class="space-y-4">
          <!-- Aquí se insertarán dinámicamente los pedidos confirmados -->
        </div>
        <div id="filtros-pedidos" class="flex flex-wrap gap-2 mb-6 justify-center">
    <button data-filtro-estado="Todos" class="btn-filtro-pedido bg-gray-800 text-white px-3 py-1.5 rounded-full text-sm font-semibold transition">
      Todos (<span id="cant-todos">0</span>)
    </button>
    <button data-filtro-estado="Pendiente" class="btn-filtro-pedido bg-gray-200 text-gray-800 border px-3 py-1.5 rounded-full text-sm font-semibold hover:bg-gray-300 transition">
      Pendiente (<span id="cant-pendiente">0</span>)
    </button>
    <button data-filtro-estado="En preparación" class="btn-filtro-pedido bg-gray-200 text-gray-800 border px-3 py-1.5 rounded-full text-sm font-semibold hover:bg-gray-300 transition">
      En preparación (<span id="cant-preparacion">0</span>)
    </button>
    <button data-filtro-estado="Entregado" class="btn-filtro-pedido bg-gray-200 text-gray-800 border px-3 py-1.5 rounded-full text-sm font-semibold hover:bg-gray-300 transition">
      Entregado (<span id="cant-entregado">0</span>)
    </button>
  </div>

  <div id="pedidos-registrados" class="space-y-4">
    <!-- Se dibuja dinámicamente -->
  </div>
      </section>
      

      <!-- Panel de Mi Pedido -->
      <aside class="bg-white p-6 rounded-lg shadow-md mt-8 max-w-md mx-auto">
        <h2 class="text-xl font-semibold mb-4 text-center">Mi pedido</h2>
        <ul id="lista-pedido" class="divide-y divide-gray-200 mb-4"></ul>
        <p id="total" class="font-bold text-lg text-right mb-4">Total: $0.00</p>
        <button id="btn-vaciar" type="button" class="w-full bg-gray-700 text-white px-4 py-2 rounded hover:bg-gray-800 transition mb-6">Vaciar</button>

        <form id="form-cliente" class="space-y-4 border-t pt-4" novalidate>
          <h3 class="font-semibold text-lg mb-2 text-gray-700">Datos de contacto</h3>
          <div>
            <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <p id="error-nombre" class="text-sm text-red-600 hidden mt-1"></p>
          </div>
          <div>
            <label for="telefono" class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej. 5512345678" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <p id="error-telefono" class="text-sm text-red-600 hidden mt-1"></p>
          </div>
          <div>
            <label for="correo" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <p id="error-correo" class="text-sm text-red-600 hidden mt-1"></p>
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">Confirmar pedido</button>
        </form>
      </aside>
    </main>

    <footer class="bg-gray-800 text-white text-center py-4 mt-8">
      <p class="text-xl font-semibold mb-2">Equipo Fsociety 6</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
